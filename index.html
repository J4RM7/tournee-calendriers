<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tournée Calendriers</title>

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#B71C1C" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-titre">
      <h1>Tournée Calendriers</h1>
      <span id="tournee-info" class="tournee-info" hidden></span>
    </div>
    <div class="header-right">
      <button id="btn-admin" class="secondaire" hidden>Administration</button>
      <span id="agent-badge" class="badge" hidden></span>
      <button id="btn-deconnexion" class="secondaire" hidden>Déconnexion</button>
      <span id="statut-connexion" class="badge">…</span>
    </div>
  </header>

  <section id="ecran-connexion" hidden>
    <div class="connexion-carte">
      <h2>Connexion</h2>
      <p>Entrez votre email de caserne : vous recevrez un lien de connexion à usage unique, pas de mot de passe à retenir.</p>
      <form id="form-connexion">
        <label for="connexion-email">Email</label>
        <input type="email" id="connexion-email" required placeholder="prenom.nom@centre-secours.fr" />
        <button type="submit" class="primary">Recevoir un lien de connexion</button>
      </form>
      <p id="connexion-message" class="connexion-message"></p>
      <button id="btn-mode-demo" class="secondaire">Continuer en mode démo (sans compte)</button>
    </div>
  </section>

  <main id="app" hidden>
    <div class="rue-header">
      <h2 id="rue-nom">Chargement…</h2>
      <div class="rue-stats">
        <span id="rue-compteur" class="rue-compteur"></span>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
    </div>
    <ul id="liste-adresses" class="liste-adresses"></ul>
  </main>

  <section id="ecran-admin" hidden>
    <div class="admin-bloc">
      <h2>Créer une tournée</h2>
      <form id="form-nouvelle-tournee" class="form-inline">
        <input type="number" id="admin-numero" placeholder="N° tournée" min="1" required />
        <input type="text" id="admin-commune" placeholder="Commune" required />
        <input type="text" id="admin-rue" placeholder="Rue" required />
        <button type="submit" class="primary">Créer</button>
      </form>
      <p id="admin-message" class="connexion-message"></p>
    </div>

    <div class="admin-bloc">
      <h2>Tournées</h2>
      <ul id="admin-liste-tournees" class="admin-liste-tournees"></ul>
    </div>
  </section>

  <!-- Formulaire de saisie d'un don, affiché quand on clique sur la case
       "don" d'une adresse -->
  <dialog id="dialog-don">
    <form id="form-don" method="dialog">
      <h2 id="don-adresse-label">Don</h2>

      <div class="don-choix">
        <button type="button" id="don-choix-donne" class="choix-btn actif">A donné</button>
        <button type="button" id="don-choix-refuse" class="choix-btn">A refusé</button>
      </div>

      <div id="don-champs-montant">
        <label for="don-montant">Montant (€)</label>
        <input type="number" id="don-montant" min="0" step="0.5" inputmode="decimal" />

        <label for="don-mode">Mode de paiement</label>
        <select id="don-mode">
          <option value="especes">Espèces</option>
          <option value="cheque">Chèque</option>
        </select>
      </div>

      <label for="don-nom">Nom du donateur (optionnel)</label>
      <input type="text" id="don-nom" />

      <label for="don-email">Email du donateur (optionnel, pour le reçu plus tard)</label>
      <input type="email" id="don-email" />

      <div class="dialog-actions">
        <button type="button" id="don-annuler">Annuler</button>
        <button type="submit" id="don-valider" class="primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
